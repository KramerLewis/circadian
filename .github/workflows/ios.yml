name: iOS

on:
  push:
    branches: [main, sunclock]
    paths:
      - "ios/**"
      - "shared/fixtures/**"
      - ".github/workflows/ios.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "ios/**"
      - "shared/fixtures/**"
      - ".github/workflows/ios.yml"
      - ".github/scripts/**"
  workflow_dispatch:

# A newer push makes an in-flight run on the same branch pointless.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suncore:
    name: SunCore tests (macOS host)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: .github/scripts/select-xcode.sh
      - name: swift test
        run: swift test --package-path ios/SunCore

  app:
    name: App build + tests (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: .github/scripts/select-xcode.sh
      - name: Pick a simulator
        id: sim
        run: echo "udid=$(.github/scripts/pick-simulator.sh)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          xcodebuild build \
            -workspace ios/SunClock.xcworkspace \
            -scheme SunClock \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Test
        run: |
          xcodebuild test \
            -workspace ios/SunClock.xcworkspace \
            -scheme SunClock \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

  screenshots:
    name: Simulator screenshots
    runs-on: macos-26
    permissions:
      contents: write
    # Three simulators (iPhone, 6.9" iPhone, Watch) and ~40 shots.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: .github/scripts/select-xcode.sh
      - name: Pick a simulator
        id: sim
        run: echo "udid=$(.github/scripts/pick-simulator.sh)" >> "$GITHUB_OUTPUT"
      - name: Capture
        run: .github/scripts/screenshots.sh "${{ steps.sim.outputs.udid }}" screenshots
      - name: Pick a 6.9" iPhone for the App Store set
        id: promax
        run: echo "udid=$(.github/scripts/pick-simulator.sh iOS 'Pro Max')" >> "$GITHUB_OUTPUT"
      - name: Capture App Store set
        run: .github/scripts/screenshots.sh "${{ steps.promax.outputs.udid }}" screenshots/app-store appstore
      - name: Pick a Watch simulator
        id: watch
        run: echo "udid=$(.github/scripts/pick-simulator.sh watchOS)" >> "$GITHUB_OUTPUT"
      - name: Capture Watch
        run: .github/scripts/watch-screenshots.sh "${{ steps.watch.outputs.udid }}" screenshots
      # Only on pushes: pull requests (including from forks) never get write access.
      - name: Publish to the screenshots branch
        if: github.event_name == 'push'
        run: .github/scripts/publish-screenshots.sh screenshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
