name: Web

on:
  push:
    branches: [main, sunclock]
    paths:
      - "web/**"
      - "docs/**"
      - "shared/fixtures/**"
      - ".github/workflows/web.yml"
      - ".github/scripts/publish-screenshots.sh"
  pull_request:
    paths:
      - "web/**"
      - "shared/fixtures/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:
  # Called by the NASA assets workflow after it commits new images, to deploy them
  # (commits made with the workflow token don't start other workflows by themselves).
  workflow_call:
    inputs:
      ref:
        description: "Commit to build and deploy"
        type: string
        required: false

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  build:
    name: Typecheck, tests (shared fixtures), build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  screenshots:
    name: Screenshots (Chromium, light + dark)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Capture
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          node scripts/screenshots.mjs http://localhost:4173/ ../screenshots-web
      - name: Publish to the screenshots-web branch
        if: github.event_name == 'push'
        working-directory: .
        run: .github/scripts/publish-screenshots.sh screenshots-web screenshots-web "SunClock web screenshots"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes docs/ (privacy, support) at the site root and the web app at /app/.
  # Needs Settings > Pages > Source set to "GitHub Actions", and the repository
  # variable PAGES_DEPLOY set to true, so it stays off until that's done.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && vars.PAGES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}app/
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist
      - run: sudo mkdir -p _site/app && sudo cp -R web-dist/. _site/app/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
