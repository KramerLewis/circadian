name: NASA assets

# Downloads the NASA images listed in shared/tools/nasa_sources.json, converts them
# (EXR star maps are tone-mapped to JPEG, SDO sun images cropped to the disc), commits
# the results to the branch, and deploys the web app with them. CI runners can reach
# NASA's servers; the dev environment and the GitHub web uploader (25 MB limit) can't.
#
# Monthly, the sun images are refreshed for the web. The iPhone app bundles its copy, so
# it only changes with a regular app release (never a release just for new images).
# Scheduled runs and "Run workflow" need this file on the default branch; until then it
# runs when the manifest, script or this file change.

on:
  push:
    branches: [main, sunclock]
    paths:
      - "shared/tools/nasa_sources.json"
      - "shared/tools/fetch_nasa_assets.py"
      - ".github/workflows/nasa-assets.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *" # 06:17 UTC on the 1st of each month

concurrency:
  group: nasa-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch and convert NASA imagery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install OpenEXR numpy pillow
      - run: python3 shared/tools/fetch_nasa_assets.py
      - name: Commit the converted images
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/assets/nasa web/public ios/Shared
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "NASA assets: fetched and converted by CI" -m "From shared/tools/nasa_sources.json."
            # Retry: GitHub occasionally rejects a push with a server error, and the
            # branch may have moved on while the images were being fetched.
            for attempt in 1 2 3 4; do
              git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              [ "$attempt" = 4 ] && exit 1
              sleep $((attempt * 5))
            done
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # Deploy the web app with the new images (only when something changed).
  web:
    name: Deploy the web app
    needs: fetch
    if: needs.fetch.outputs.sha != ''
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/web.yml
    with:
      ref: ${{ needs.fetch.outputs.sha }}
